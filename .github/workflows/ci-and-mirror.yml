name: CI and mirror to NAS

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  backend-quality-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: pic_test
          MYSQL_USER: pic_ci
          MYSQL_PASSWORD: pic-ci-test-password
          MYSQL_ROOT_PASSWORD: pic-ci-test-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test API and real MySQL persistence
        env:
          PIC_TEST_DSN: pic_ci:pic-ci-test-password@tcp(127.0.0.1:3306)/pic_test?charset=utf8mb4&parseTime=true&loc=UTC
        run: go test ./cmd/api ./cmd/migrate ./internal/modules/library ./internal/platform/database ./internal/transport/httpapi -count=1
      - name: Build API and migrator
        run: go build ./cmd/api ./cmd/migrate

  mirror-to-nas:
    needs: [quality-gates, backend-quality-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push master to NAS mirror
        env:
          NAS_HOST: ${{ secrets.NAS_HOST }}
          NAS_PORT: ${{ secrets.NAS_PORT }}
          NAS_USER: ${{ secrets.NAS_USER }}
          NAS_KNOWN_HOSTS: ${{ secrets.NAS_KNOWN_HOSTS }}
          NAS_SSH_KEY: ${{ secrets.NAS_SSH_KEY }}
        run: |
          set -Eeuo pipefail
          key_file="$RUNNER_TEMP/pic_nas_key"
          known_hosts_file="$RUNNER_TEMP/pic_known_hosts"
          printf '%s\n' "$NAS_SSH_KEY" > "$key_file"
          printf '%s\n' "$NAS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          export GIT_SSH_COMMAND="ssh -i $key_file -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts_file -p $NAS_PORT"
          git remote add nas "ssh://$NAS_USER@$NAS_HOST/volume1/docker/pic-git/Pic.git"
          git push nas HEAD:refs/heads/master
