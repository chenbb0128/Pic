app:
  name: go-template
  env: local

http:
  addr: ":8080"
  read_header_timeout: 5s
  read_timeout: 15s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576
  max_body_bytes: 1048576
  trusted_proxies: []
  cors:
    allowed_origins:
      - "http://localhost:3000"
      - "http://localhost:5173"
    allowed_methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed_headers:
      - Authorization
      - Content-Type
      - X-Request-ID
      - traceparent
      - tracestate
    allow_credentials: false

database:
  enabled: true
  driver: mysql
  dsn: "go_template:go_template_pass@tcp(127.0.0.1:3306)/go_template"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m
  ping_timeout: 3s

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  dial_timeout: 3s
  read_timeout: 2s
  write_timeout: 2s
  ping_timeout: 2s
  pool_size: 10
  min_idle_conns: 2
  key_prefix: "go-template:local"

worker:
  enabled: false
  concurrency: 10
  shutdown_timeout: 10s
  queues:
    default: 1

observability:
  metrics:
    enabled: true
    path: /metrics
    namespace: go_template
  tracing:
    enabled: false
    exporter: stdout # stdout or otlp
    endpoint: localhost:4317
    insecure: true
    sample_ratio: 1.0

log:
  level: info
